name: Mali experimental APK build attempt
on:
  workflow_dispatch:
  push:
    paths:
      - 'droiddeck-mali/**'
      - '.github/workflows/mali-apk-attempt.yml'
permissions:
  contents: read
  actions: read
jobs:
  xbox:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Get upstream
        run: git clone --depth 1 https://github.com/Droid-Deck/DroidDeck.git upstream
      - name: Build Xbox ARM64
        working-directory: upstream
        run: python3 tools/components/prepare.py xbox
      - uses: actions/upload-artifact@v4
        with:
          name: mali-xbox-arm64
          path: upstream/app/src/main/assets/linuxfs/usr/local/lib/droiddeck-xbox
          if-no-files-found: error
  build:
    needs: xbox
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clone and patch upstream
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Droid-Deck/DroidDeck.git upstream
          python3 droiddeck-mali/patch_mali_icd.py upstream
          git -C upstream diff --check
      - uses: actions/download-artifact@v4
        with:
          name: mali-xbox-arm64
          path: upstream/app/src/main/assets/linuxfs/usr/local/lib/droiddeck-xbox
      - name: Prepare Android toolchain
        working-directory: upstream
        run: bash tools/ci/resolve-ndk.sh
      - name: Prepare all upstream components in dependency order
        working-directory: upstream
        run: |
          set -euo pipefail
          python3 tools/components/prepare.py tools
          python3 tools/components/prepare.py arm64-preloads
          python3 tools/components/prepare.py runtime
          python3 tools/components/prepare.py debian-image
          python3 tools/components/prepare.py x86-preloads
          python3 tools/components/prepare.py esync
          python3 tools/components/prepare.py pulseaudio-source
          python3 tools/components/prepare.py directaudio
          python3 tools/components/prepare.py audio
          python3 tools/components/prepare.py proot
          python3 tools/components/prepare.py comet
          bash tools/linuxfs/check-preloads.sh app/src/main/assets/linuxfs
          python3 tools/quest/build-driver.py "$ANDROID_HOME/ndk/$NDK_VERSION"
          python3 tools/components/prepare.py pack
      - name: Build verified add-on packs
        working-directory: upstream
        run: |
          set -euo pipefail
          command -v zstd || sudo apt-get install -y zstd
          bash tools/packs/build.sh app/build/packs
      - name: Build experimental APK
        working-directory: upstream
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --console=plain -PndkVersion="$NDK_VERSION"
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload diagnostics and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mali-build-output
          path: |
            upstream/app/build/outputs/apk/debug/*.apk
            upstream/app/build/reports/**
          if-no-files-found: warn
          retention-days: 14
